[project]
name = "docqa"
version = "0.1.0"
description = "扫描版 PDF 智能文档问答 Agent —— 文档理解 + 检索问答 + 可靠性验证"
readme = "README.md"
# 本仓库**自己的代码**是 MIT（见 LICENSE）。但 PyMuPDF 是 AGPL-3.0，
# 分发或对外提供服务会触发 AGPL 义务——LICENSE 文件末尾与
# docs/deployment.md 已写清边界，不在这里假装它不存在。
license = { file = "LICENSE" }
# 钉 3.12：MinerU 在 Windows 上只支持 3.10–3.12（被 ray 卡在 3.13），
# EasyOCR 也明确不推荐 3.12+。钉在这里 = 本地 OCR 备选路线全部保留。
requires-python = ">=3.12,<3.13"

dependencies = [
    "pymupdf>=1.28.2",        # PDF 解析/渲染；AGPL-3.0，见 docs/scalability.md
    "pillow>=11.0.0",         # 图像处理；含 WebP 解码（拼回官方预览页要用）
    "httpx>=0.28.1",          # OpenAI 兼容端点的 HTTP 调用
    "anthropic>=0.75.0",      # Anthropic Messages API 用官方 SDK，不手搓 HTTP
    "typer>=0.27.0",          # CLI
    "rich>=13.9.0",           # CLI 渲染
    "pydantic>=2.10.0",       # 配置与数据模型校验
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.0",   # 只读 .env，密钥绝不入库
    "pyyaml>=6.0.2",          # config/*.yaml
    "jieba>=0.42.1",          # 中文分词（BM25 词元臂）
    "rank-bm25>=0.2.2",       # 纯 Python BM25，无需模型
    "fastapi>=0.141.0",       # Web UI
    "uvicorn>=0.52.0",
]

[project.optional-dependencies]
# 注意：这里**没有** `table` 这个 extra。
#
# 它曾经声明 `rapid-table>=3.0.2`，注释写着"与 VLM 做跨引擎交叉校验"，
# 但全仓库**零 import**——装上也什么都不发生。跨引擎交叉校验走的是
# `DOCQA_OCR2_*`（第二个视觉模型），与 rapid-table 无关。
# 留一个装了不生效的 extra，比不留更糟：`uv sync --all-extras` 会把它装上，
# 然后让人以为表格校验这一路已经有保障了。

# OCR 精度评估。单独分组是因为它们是**评估**依赖而非运行依赖——
# 没有它们仍能问答，只是跑不了 CER 指标（评估会明确标注该项缺失，不静默跳过）。
eval = [
    "jiwer>=3.1.0",           # CER/WER。注意必须配字符级变换，
                              # 默认按空格切分对中文是错的（见 eval/metrics.py）
    "zhconv>=1.4.3",          # 繁简归一：OCR 可能输出繁体变体，
                              # 不归一会被算成替换错误，虚高 CER
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
# 必须绑到 `main` 而不是 `app`。
#
# Click/Typer 的 standalone 模式只捕获 ClickException / Abort / Exit，
# **不捕获业务异常**。绑 `app` 的话，cli.py 里 `main()` 中的
# `except DocqaError -> _fail()` 就是死代码：异常带着 traceback 冲出进程，
# 退出码退化成固定的 1，精心写的"缺哪个变量、去哪配、有哪些替代路径"
# 那套提示永远不会出现。
# 测试用 `CliRunner` 直接调 `app`，与这里不冲突。
docqa = "docqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: 需要真实模型密钥的测试（默认跳过）",
]

[tool.coverage.run]
source = ["src/docqa"]
omit = [
    "src/docqa/web/*",
    # 平台相关、且只在真实端点下才走到的路径。列出来是为了让"未覆盖"
    # 这个数字诚实：它们不是"忘了写测试"，是"没法在无密钥环境里测"。
    "src/docqa/llm/anthropic.py",
]

[tool.coverage.report]
# 覆盖率门禁。**刻意放在配置里而不是 CI 命令里**：
# 本地 `pytest --cov` 与 CI 遵守同一个门槛，避免"CI 绿了、本地其实降了"。
# 86 是当前实测值（3486 条语句、约 480 未覆盖）向下取整的保守下限——
# 定成当前值会让每个无关改动都去动这个数字，定得太低又拦不住回归。
fail_under = 84
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes（能抓出未使用的 import / 变量，本项目之前踩过死代码的坑）
    "I",    # import 排序
    "B",    # bugbear（可变默认值、zip 不带 strict 之类）
]
ignore = [
    # 中文注释里的全角标点会让 E501 误报；行长由 ruff format 负责，不重复管。
    "E501",
    # FastAPI 的依赖注入靠默认值传参，B008 会误报。
    "B008",
    # `__all__` 里列出的名字在本文件"未使用"是正常的：那是再导出。
    # 关掉这条会连真正的死导入一起漏掉，所以宁可在这里配 `allowed-*`；
    # 本项目每个包都有 __init__ 再导出，逐条 noqa 反而更吵。
]
# `__init__.py` 的再导出视为使用。
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# 包的 __init__ 靠 import 做再导出，F401 在那里没有意义。
"src/docqa/**/__init__.py" = ["F401"]
# 测试里 fixture 常按名字注入、`import pytest` 用于 mark，误报较多；
# 只保留真正会导致 bug 的规则。
"tests/**" = ["F401", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["docqa"]

# 注意：**故意不启用** `ruff format` 的强制校验。
# 本仓库的注释与对齐是刻意排版的，自动折行会产生与功能无关的巨大 diff。
# 格式留给作者，CI 只守正确性（lint + 测试 + 覆盖率 + 回归基线）。
