<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>docqa · 扫描件问答</title>
<style>
:root{
  --bg:#f7f6f2; --panel:#fff; --ink:#191713; --muted:#6f6b63; --line:#e2ddd2;
  --ok:#1c7a4c; --warn:#a3620a; --bad:#9e2b1d; --accent:#2b5c86; --accent-soft:#eaf1f7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans)}
header{padding:22px 28px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 small{font-weight:400;color:var(--muted);font-size:12.5px;font-family:var(--mono)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 80px;
  display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
form{display:flex;gap:9px}
input[type=text]{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  font:inherit;background:#fdfcfa;color:inherit}
input[type=text]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button{padding:11px 20px;border:0;border-radius:9px;background:var(--ink);color:#fff;
  font:inherit;font-weight:550;cursor:pointer}
button:disabled{opacity:.5;cursor:progress}
.examples{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.examples button{background:none;color:var(--accent);border:1px solid var(--line);
  padding:4px 11px;font-size:12.5px;border-radius:99px;font-weight:400}
.examples button:hover{background:var(--accent-soft)}
.status{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.verdict{display:flex;align-items:center;gap:9px;font-weight:600;margin-bottom:10px}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block}
.dot.ok{background:var(--ok)} .dot.no{background:var(--warn)} .dot.bad{background:var(--bad)}
.answer{font-size:15.5px;white-space:pre-wrap;padding:12px 14px;border-radius:0 8px 8px 0;
  background:#f6faf7;border-left:3px solid var(--ok)}
.answer.refused{background:#fdf7f4;border-left-color:var(--warn)}
.cites{margin-top:14px}
.cite{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:8px 0;background:#fdfcfa}
.cite .h{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600}
.cite .t{margin-top:6px;font-size:14px;white-space:pre-wrap}
mark{background:#fff2ba;padding:0 2px;border-radius:3px}
.checks{font-size:13px}
.chk{display:flex;gap:9px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.chk:last-child{border-bottom:0}
.chk .m{font-family:var(--mono);font-weight:700;width:15px;flex:none}
.chk.p .m{color:var(--ok)} .chk.f .m{color:var(--bad)}
.chk .nm{font-family:var(--mono);font-size:12.5px;min-width:150px;flex:none}
.chk .dt{color:var(--muted);font-size:12.5px}
.chk .sev{font-size:10.5px;padding:1px 6px;border-radius:99px;background:#eef1f4;
  color:var(--muted);margin-left:5px;vertical-align:1px}
.trace{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
.trace .s{padding:1px 7px;border-radius:99px;background:#eef1f4;margin-right:5px;display:inline-block}
.trace .s.repair{background:#fdeecd;color:var(--warn)}
.trace .s.verify{background:#e6f2ea;color:var(--ok)}
.trace .s.give_up,.trace .s.precheck{background:#fbe6e2;color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--mono);font-size:11.5px;padding:2px 9px;border-radius:99px;
  background:#eef1f4;color:var(--muted)}
.chip.warn{background:#fdeecd;color:var(--warn)}
.err{background:#fdf1ef;border:1px solid #f0d5cf;color:var(--bad);
  padding:12px 14px;border-radius:9px;font-size:13.5px}
.empty{color:var(--muted);font-size:13.5px;padding:14px 0}
</style>
</head>
<body>
<header>
  <h1>扫描件问答 <small id="docinfo">加载中…</small></h1>
</header>
<main>
  <section>
    <div class="card">
      <h2>提问</h2>
      <form id="f">
        <input type="text" id="q" placeholder="就这份扫描件提问…" autocomplete="off" required>
        <button id="go" type="submit">提问</button>
      </form>
      <div class="examples" id="ex"></div>
    </div>
    <div id="out"></div>
  </section>

  <aside>
    <div class="card">
      <h2>自检结论</h2>
      <div id="checks"><div class="empty">提问后显示各项检查结果。</div></div>
    </div>
    <div class="card">
      <h2>引用来源</h2>
      <div id="cites"><div class="empty">引用证据会显示在这里，命中片段会高亮。</div></div>
    </div>
    <div class="card">
      <h2>执行轨迹</h2>
      <div id="trace"><div class="empty">检索 → 起草 → 自检 → 修复 → 放行或拒答。</div></div>
    </div>
    <div class="card">
      <h2>文档概览</h2>
      <div id="overview"><div class="empty">—</div></div>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function highlight(text, quote){
  const t = esc(text);
  if(!quote) return t;
  const frag = esc(quote.slice(0, 40));
  if(frag.length < 6) return t;
  return t.split(frag).join('<mark>' + frag + '</mark>');
}

async function loadStatus(){
  try{
    const r = await fetch('/api/status');
    const d = await r.json();
    if(!d.ready){
      $('#docinfo').textContent = '未就绪';
      $('#out').innerHTML = '<div class="err">' + esc(d.error) + '</div>';
      return;
    }
    $('#docinfo').textContent = d.doc_id;
    $('#overview').innerHTML = `
      <table>
        <tr><td>类型</td><td class="num">${esc(d.kind)}</td></tr>
        <tr><td>页数</td><td class="num">${d.pages}</td></tr>
        <tr><td>片段</td><td class="num">${d.chunks}（表格 ${d.tables}）</td></tr>
        <tr><td>引用模式</td><td class="num">${esc(d.citation_mode)}</td></tr>
        <tr><td>OCR 引擎</td><td class="num">${esc(d.engine)}</td></tr>
        <tr><td>生成模型</td><td class="num">${d.has_llm ? '已配置' : '未配置（抽取式）'}</td></tr>
      </table>
      <div class="chips">
        ${d.failed_pages.length ? '<span class="chip warn">识别失败页：' + d.failed_pages.join(',') + '</span>'
                                : '<span class="chip">全部页面识别成功</span>'}
        ${d.tables ? '<span class="chip">含表格</span>' : ''}
      </div>`;
    const ex = document.querySelector('#ex');
    ex.innerHTML = '';
    ['表 1 中半圆键的键宽 b 的 AQL 是多少？',
     '3.6 条对楔键斜度是怎么规定的？',
     '本标准是否规定了键的材料牌号？',
     '本标准代替了哪些历次版本？'].forEach(s => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = s;
      b.onclick = () => { $('#q').value = s; $('#f').requestSubmit(); };
      ex.appendChild(b);
    });
  }catch(e){
    $('#out').innerHTML = '<div class="err">无法连接后端：' + esc(e) + '</div>';
  }
}

function renderChecks(v){
  if(!v || !v.checks || !v.checks.length){
    $('#checks').innerHTML = '<div class="empty">本次未产生检查项。</div>'; return;
  }
  $('#checks').innerHTML = v.checks.map(c => `
    <div class="chk ${c.passed ? 'p' : 'f'}">
      <span class="m">${c.passed ? '✓' : '✗'}</span>
      <span class="nm">${esc(c.name)}<span class="sev">${esc(c.severity)}</span></span>
      <span class="dt">${esc(c.detail)}${c.offenders && c.offenders.length
        ? '<br>' + c.offenders.slice(0,3).map(esc).join('<br>') : ''}</span>
    </div>`).join('')
    + `<div class="note" style="margin-top:8px">句级支撑度 ${(v.support_score ?? 0).toFixed(2)}
       （咨询性指标，不作放行判定）</div>`;
}

function renderCites(d){
  const ev = d.evidence || {};
  if(!d.citations || !d.citations.length){
    $('#cites').innerHTML = '<div class="empty">本次没有引用。</div>'; return;
  }
  $('#cites').innerHTML = d.citations.map(c => {
    const e = ev[c.chunk_id] || {};
    const body = c.quote || e.text || '';
    return `<div class="cite">
      <div class="h">${esc(c.rendered)} · ${esc(c.chunk_id)}</div>
      <div class="t">${highlight(body, c.quote)}</div>
    </div>`;
  }).join('');
}

function renderTrace(trace){
  if(!trace || !trace.length){ $('#trace').innerHTML = '<div class="empty">—</div>'; return; }
  $('#trace').innerHTML = '<div>' + trace.map(t =>
    `<span class="s ${esc(t.step)}">${esc(t.step)}</span>`).join('') + '</div>'
    + '<div style="margin-top:8px">' + trace.map(t =>
      `<div class="trace">${esc(t.step)}：${esc(t.detail)}</div>`).join('') + '</div>';
}

$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if(!q) return;
  $('#go').disabled = true;
  $('#out').innerHTML = '<div class="card"><div class="empty">推理中…</div></div>';
  try{
    const r = await fetch('/api/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: q})
    });
    if(!r.ok){ throw new Error((await r.json()).detail || ('HTTP ' + r.status)); }
    const d = await r.json();

    const ok = !d.refused;
    const dot = ok ? 'ok' : (d.refusal_reason === 'verification_failed' ? 'bad' : 'no');
    const label = ok ? '已作答' : '按策略拒答';
    let html = `<div class="card">
      <div class="verdict"><span class="dot ${dot}"></span>${label}
        <span class="status">· 尝试 ${d.attempts} 轮 · 自检${d.verification.gates_passed ? '通过' : '未通过'}</span>
      </div>
      <div class="answer ${ok ? '' : 'refused'}">${esc(d.answer) || esc(d.refusal_detail) || '（无内容）'}</div>`;

    if(d.refusal_reason){
      html += `<div class="note" style="margin-top:9px">拒答理由：
        <code>${esc(d.refusal_reason)}</code> — ${esc(d.refusal_detail || '')}</div>`;
    }
    if(d.candidates && d.candidates.length){
      html += `<table style="margin-top:12px"><tr><th>候选解释</th><th>取值</th><th>出处</th></tr>`
        + d.candidates.map(c => `<tr><td>${esc(c.interpretation)}</td>
            <td class="num">${esc(c.value)}</td><td class="num">${esc(c.citation)}</td></tr>`).join('')
        + `</table>`;
    }
    html += `</div>`;
    $('#out').innerHTML = html;

    renderChecks(d.verification);
    renderCites(d);
    renderTrace(d.trace);
  }catch(err){
    $('#out').innerHTML = '<div class="err">请求失败：' + esc(err.message) + '</div>';
  }finally{
    $('#go').disabled = false;
  }
});

loadStatus();
</script>
</body>
</html>
