# 业务场景：公文/通知类文件
#
# 场景特征：层次用"一、""（一）""1."而非条号；正文常是连续段落，可能整篇没有
# 显式标题结构；落款与日期在文末；名单有时是散文式而非表格。
#
# 这个 profile 的存在本身就是对"退化路径"的验证——短公文若不触发条款切分，
# 切分器必须能回退到句子窗口，否则检索单位会退化成整页一个 chunk。

description: 公文与通知类文件（一二三/（一）/1. 层次，正文常为连续段落）

clause_patterns:
  # 一、二、三、
  - '^\s*(?P<label>[一二三四五六七八九十]+)\s*[、.．]\s*(?P<title>\S.*)$'
  # （一）（二）
  - '^\s*(?P<label>[（(][一二三四五六七八九十]+[）)])\s*(?P<title>\S.*)$'
  # 1. 2. 3.
  - '^\s*(?P<label>\d+)\s*[.．、]\s*(?P<title>\S.*)$'
  # 落款单位（常见于文末单独成行，如"泰州学院人工智能学院"）
  - '^\s*(?P<label>落款)\s*(?P<title>\S.*)$'

# 公文的表格线索弱于标准件——很多通知根本没有表格。
table_cues:
  - 名单
  - 表格
  - 附表
  - 附件
  - 一览表

citation_template: "[p.{page} §{clause}]"

chunk:
  # 公文段落短，chunk 上限相应调小
  max_chars: 500
  overlap_chars: 80
  # 无标题结构时的句子窗口
  sentence_window_chars: 200
  sentence_overlap: 1

retrieve:
  top_k: 5
  arm_weights:
    bm25_word: 1.0
    # 公文里人名、单位名是高频查询目标，字符二元组臂对这种短查询很有效
    bm25_char: 1.0
  table_boost: 1.2

qa:
  # 公文语义不如标准件精确，阈值略放宽；但仍高于通用默认值，
  # 因为"无答案"题在这类文档里很常见（问的细节往往根本没写）。
  min_coverage: 0.45
  min_top_score: 0.0
  support_score_gate: null
