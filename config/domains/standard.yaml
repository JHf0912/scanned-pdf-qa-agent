# 业务场景：标准/规范类文件（GB/T、行业标准、企业技术规范）
#
# 场景特征：条号层级严格（3.6、4.1.1）、表格承载关键数值（尺寸、公差、AQL）、
# 数字与单位一旦错一个字就失去意义。
#
# 迁移到新场景时**改这个文件即可，不用改代码**——这是"可扩展"的落点。

description: 标准与规范类文件（条款号分级、表格承载关键数值）

# 条款/条号的正则，按顺序尝试。
# 国标的层次：章(1) -> 条(3.1) -> 条(3.1.1)，GB/T 1.1-2020 规定最多 5 层。
# 要求条号后必须跟非空白的标题或正文，否则正文里以数字开头的句子会被误判为条号。
clause_patterns:
  - '^\s*(?P<label>\d+(?:\.\d+){0,4})\s+(?P<title>\S.*)$'
  # 附录内的条号：A.1、A.1.1
  - '^\s*(?P<label>[A-Z]\.\d+(?:\.\d+){0,3})\s+(?P<title>\S.*)$'
  # 列项：a) b) c) —— 挂在所属条下，不单独成条
  - '^\s*(?P<label>[a-z])\)\s*(?P<title>\S.*)$'

# 表格题的路由线索：问题里出现这些词时，提升表格 chunk 的检索权重。
table_cues:
  - 表
  - AQL
  - 合格质量水平
  - 检查项目
  - 尺寸
  - 公差
  - 偏差
  - 多少
  - 几
  - 数值
  - 限值

# 引用渲染模板。
citation_template: "[p.{page} §{clause}]"

chunk:
  max_chars: 600
  # 标准条款之间语义独立，重叠可以小一些
  overlap_chars: 60

retrieve:
  top_k: 6
  # 标准件里数值与条号是强信号，词元臂权重给高一些
  arm_weights:
    bm25_word: 1.0
    bm25_char: 0.7
  # 表格题在本场景占比高，表格加权比对通用公文更高
  table_boost: 1.5

qa:
  # 标准件的数值必须精确，拒答阈值取保守值：
  # 宁可多拒答让用户去看证据，也不要给一个错数字。
  #
  # 0.6 是**实测标定**出来的，不是拍的：本语料上相关题覆盖率 0.60~1.00，
  # 而无答案题（"键槽深度 t"、"验收费用由谁承担"）落在 0.33~0.50。
  # 原先填 0.5 恰好压在边界上——`coverage < 0.5` 对 0.50 不成立，
  # 于是三道无答案题一道都没拒答，拒答精确率与召回率双双为 0。
  min_coverage: 0.6
  min_top_score: 0.0
  support_score_gate: null
