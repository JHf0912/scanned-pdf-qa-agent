# 全局流水线配置。
#
# 注意：**密钥不写在这里**。本文件只放非敏感参数；模型端点与密钥由 .env 提供，
# 配置层按变量名引用（见 src/docqa/config.py）。这样密钥既能"放在项目配置体系里"，
# 又不会被提交进仓库。

# ----------------------------------------------------------------- 页图渲染
render:
  # auto = 优先位精确取出 PDF 内嵌图像（不重采样，对 OCR 信息量最大），
  #        取不到时回退光栅化；extract/raster 为强制模式。
  mode: auto
  # null = 用页面原生 DPI。本项目的两份输入分别是 280 DPI 与 200 DPI。
  dpi: null
  # 放大倍数。默认 1.0，即不放大。
  #
  # 为什么不默认放大：源就 280/200 DPI，放大是**插值，不产生新信息**。
  # 但放大确实可能改善 VLM 对小号中文字的辨识率——那是另一种机制（模型输入的
  # 有效分辨率），不是"恢复了精度"。要不要放大应由 A/B 实验决定，
  # 见 docs/evaluation.md 的 "DPI / upscale 消融" 一节。
  upscale: 1.0
  max_dpi: 600
  image_format: png
  jpeg_quality: 90

# ----------------------------------------------------------------- 文本切分
chunk:
  # 单个 chunk 的字符上限。超长条款才会触发二次切分。
  max_chars: 800
  overlap_chars: 100
  # 句子窗口回退参数：文档没有标题/条款结构时使用。
  # 这条退化路径是必需的——短公文可能整篇是一段连续文字，
  # 此时条款切分只会产出一个 chunk，引用会退化成页级。
  sentence_window_chars: 200
  sentence_overlap: 1

# ----------------------------------------------------------------- 检索
retrieve:
  top_k: 5
  # RRF（倒数排名融合）常数。60 是常用取值，对头部排名不敏感。
  rrf_k: 60
  # 两条检索臂的权重。两条臂都**不需要任何模型或密钥**，
  # 所以"混合检索"在任何机器上都可复现。
  #   bm25_word —— jieba 分词后的词元级 BM25
  #   bm25_char —— 字符二元组 BM25，对中文短查询与生僻姓名特别有效
  arm_weights:
    bm25_word: 1.0
    bm25_char: 0.8
  # 问题里出现表格线索词时，给表格 chunk 的加权。
  table_boost: 1.3
  # 注意：这里**没有** enable_dense。
  # 它曾经存在，但 HybridIndex 从不读取它（dense 分支硬编码为 None），
  # 文档里却写着"配置打开即可"——那是一个打开也不会变的开关。
  # 做稠密检索需要 embedding 端点、缓存与新的评估口径，是独立任务，
  # 在那之前不在这里留假开关。

# ----------------------------------------------------------------- 问答与自检
qa:
  temperature: 0.0
  max_tokens: 1200
  # 有界修复循环的最大尝试次数。
  # 自检一旦不过门就触发修复（改写查询 / 换检索臂 / 走表格路由），复检仍不过才拒答。
  # 设上限是为了防止无限重试把成本打爆。
  max_attempts: 2
  # 拒答阈值，在 golden 集上校准后填入（当前值仅为首轮保守起点）。
  min_coverage: 0.5
  min_top_score: 0.0
  # 第一名与第二名的最小分差。0.0 = 关闭。
  #
  # 与 min_top_score 分工不同：那个管"绝对够不够相关"，这个管"有没有明确赢家"。
  # 分数都高但咬得很紧时（两份文件对同一件事规定不同、或互相限定的条款），
  # 给一个答案比不给更危险。
  #
  # 默认 0.0 是刻意的：本语料只有 16 个片段，阈值需要按场景标定。
  # ⚠ 这不是一个"设了也没用"的旋钮——`decide()` 真的会读它（见 policy.py 第 7 步），
  # 有对应用例覆盖。设成大于 0 时，分差不足会以 LOW_CONFIDENCE 拒答。
  min_score_margin: 0.0
  # 句级支撑度是否作为"门"。
  # null = 仅作咨询性指标上报，不参与放行判定。
  # 理由：它依赖中文分词，阈值在拿到实测精确率之前没有资格当门——
  # 当门只会产生大量假警报，最终训练使用者忽略这个信号。
  support_score_gate: null

# ----------------------------------------------------------------- 路径
cache_dir: data/derived/cache
artifacts_dir: artifacts
